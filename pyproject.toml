[project]
name = "carex"
version = "1.0.0"
description = "CareX: white-label multi-tenant healthcare appointment booking (Python only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "segno>=1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
