# Course branch only. Main, settings, secrets and production dispatch are unchanged.
name: Start CareX staged course pipeline
run-name: launch / source run ${{ github.run_id }} / health ${{ inputs.expected_health_status }} / ${{ github.ref_name
  }}
'on':
  workflow_dispatch:
    inputs:
      expected_health_status:
        description: 200 passes; 201 demonstrates a blocked mandatory Postman assertion
        type: choice
        options:
        - '200'
        - '201'
        default: '200'
        required: true
      free_storage_confirmed:
        description: Account-wide included artifact allowance checked before this run; no paid storage authorized
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: carex-isolated-course-lab
  cancel-in-progress: false
jobs:
  launch:
    name: Start the four-stage run
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Validate the zero-spend scope and start one bot-owned stage run
      env:
        GH_TOKEN: ${{ github.token }}
        FREE_STORAGE_CONFIRMED: ${{ inputs.free_storage_confirmed }}
        EXPECTED_HEALTH_STATUS: ${{ inputs.expected_health_status }}
      run: python postman/ci/pipeline.py launch
