name: CI
on:
  workflow_dispatch:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAREX_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q carex api
      - name: Test against dedicated Neon branch
        if: ${{ env.CAREX_TEST_DATABASE_URL != '' }}
        run: python -m pytest -q
      - name: Report skipped database tests
        if: ${{ env.CAREX_TEST_DATABASE_URL == '' }}
        run: echo "Database tests skipped; configure NEON_TEST_DATABASE_URL with a dedicated empty Neon test branch."
