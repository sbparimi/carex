# Course-branch lab only. Main's existing workflow is not changed or merged.
name: CI
on:
  workflow_dispatch:
    inputs:
      expected_health_status:
        description: '200 passes; 201 deliberately breaks the mandatory teaching assertion'
        type: choice
        required: true
        default: '200'
        options: ['200', '201']
permissions:
  contents: read
concurrency:
  group: carex-isolated-course-lab
  cancel-in-progress: false
jobs:
  contract:
    name: Verify isolated CareX contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce course branch and exact lab binding
        env:
          DATABASE_URL: ${{ secrets.COURSE_CI_NEON_DATABASE_URL }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          test "$ACTUAL_REF" = 'refs/heads/course/agentic-sdlc-api-automation'
          python postman/ci/guard_lab.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned lab tools without installer hooks
        run: |
          python -m pip install -r requirements.txt PyYAML==6.0.4
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/postman-cli" postman-cli@1.93.0
          test "$("$RUNNER_TEMP/postman-cli/node_modules/.bin/postman" --version)" = '1.93.0'
      - name: Compile application source
        run: python -m compileall -q carex api
      - name: Start the lab API, with no messaging integrations
        env:
          DATABASE_URL: ${{ secrets.COURSE_CI_NEON_DATABASE_URL }}
          CAREX_ENV: course-isolated-lab
        run: |
          python -m carex.ops serve --port 8130 > "$RUNNER_TEMP/carex-course-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/carex-course-api.pid"
          python postman/ci/wait_api.py
      - name: Execute mandatory Postman contract checks
        env:
          EXPECTED_HEALTH_STATUS: ${{ inputs.expected_health_status }}
        run: |
          "$RUNNER_TEMP/postman-cli/node_modules/.bin/postman" collection run \
            postman/ci/CareX-CI-Contract.postman_collection.json \
            -e postman/ci/CareX-CI.postman_environment.json \
            --env-var "expectedHealthStatus=$EXPECTED_HEALTH_STATUS" \
            --output course-ci-output/reports \
            --no-upload-request-bodies --no-upload-response-bodies \
            --no-upload-headers --no-upload-all-headers-and-bodies
      - name: Reject missing, skipped, simulated, stale or failed evidence
        run: python postman/ci/verify_evidence.py course-ci-output/reports --output course-ci-output/evidence.json
      - name: Retain native reports even when the assertion fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: course-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            course-ci-output/reports/*.yaml
            course-ci-output/evidence.json
          if-no-files-found: error
          retention-days: 1
      - name: Stop the disposable API process
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/carex-course-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/carex-course-api.pid")" || true
          fi
  deliver_candidate:
    name: Deliver tested lab candidate for review
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: course-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: course-ci-output/download
      - name: Independently recheck the candidate evidence
        run: python postman/ci/verify_evidence.py course-ci-output/download/reports --output course-ci-output/delivery-evidence.json
      - name: Package this exact committed source
        run: |
          git archive --format=zip --output=course-ci-output/carex-lab-candidate.zip HEAD
          sha256sum course-ci-output/carex-lab-candidate.zip > course-ci-output/SHA256SUMS
          printf '%s\n' 'Synthetic-lab review candidate only.' 'Coverage: four read-only requests and six mandatory assertions.' 'Not full regression coverage, not production approval, and not a production deployment.' > course-ci-output/CANDIDATE-SCOPE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: carex-lab-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            course-ci-output/carex-lab-candidate.zip
            course-ci-output/SHA256SUMS
            course-ci-output/delivery-evidence.json
            course-ci-output/CANDIDATE-SCOPE.txt
          if-no-files-found: error
          retention-days: 1
