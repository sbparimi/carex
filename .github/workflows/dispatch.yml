# Course branch only. Main production reminders remain unchanged.
name: CareX staged course pipeline
run-name: pipeline / source run ${{ github.run_id }} / launch ${{ inputs.launcher_run_id }} / health ${{
  inputs.expected_health_status }} / ${{ github.ref_name }}
'on':
  workflow_dispatch:
    inputs:
      expected_health_status:
        description: 200 passes; 201 demonstrates a blocked mandatory Postman assertion
        type: choice
        options:
        - '200'
        - '201'
        default: '200'
        required: true
      free_storage_confirmed:
        description: Account-wide included artifact allowance checked before this run; no paid storage
          authorized
        type: boolean
        default: false
      launcher_run_id:
        description: Set automatically by Start CareX staged course pipeline; direct human starts fail
          closed
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: carex-isolated-course-lab
  cancel-in-progress: false
jobs:
  develop:
    name: Develop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify the automatic launcher and all preflight constraints
      id: scope
      env:
        GH_TOKEN: ${{ github.token }}
        LAUNCHER_RUN_ID: ${{ inputs.launcher_run_id }}
        FREE_STORAGE_CONFIRMED: ${{ inputs.free_storage_confirmed }}
      run: 'python postman/ci/pipeline.py validate-launch

        python postman/ci/pipeline.py preflight'
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: postman/ci/requirements-ci.lock
    - name: Install hash-locked Python 3.12 check tools
      id: tools
      run: python -m pip install --require-hashes -r postman/ci/requirements-ci.lock
    - name: Verify pinned secret scanner before using it
      env:
        ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: 'curl --fail --location --retry 2 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz

        printf ''%s  %s\n'' "$ARCHIVE_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check

        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

        '
    - name: Lint and strict tooling format checks
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'''
      run: python postman/ci/quality.py lint
    - name: Security, locked-dependency advisories and secret scan
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'''
      run: python postman/ci/quality.py security
    - name: Offline pipeline controls on Python 3.12
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'''
      run: python -m pytest postman/ci/test_pipeline.py -q
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: postman/ci/requirements-ci.lock
      id: python311
      name: Set up the second required Python control version
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'''
    - name: Install hash-locked Python 3.11 check tools
      id: tools311
      if: '!cancelled() && steps.python311.outcome == ''success'''
      run: python -m pip install --require-hashes -r postman/ci/requirements-ci.lock
    - name: Offline pipeline controls on Python 3.11
      if: '!cancelled() && steps.tools311.outcome == ''success'''
      run: python -m pytest postman/ci/test_pipeline.py -q
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
      id: node
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'''
    - name: Verify all read-only board controls
      if: '!cancelled() && steps.scope.outcome == ''success'' && steps.tools.outcome == ''success'' &&
        steps.node.outcome == ''success'''
      run: node --test postman/ci/test-viewer.cjs
    - name: Retain development evidence, including failure reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: course-develop-${{ github.run_id }}
        path: course-ci-output/develop/
        if-no-files-found: error
        retention-days: 1
  build:
    name: Build
    needs: develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: python postman/ci/pipeline.py build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: course-candidate-${{ github.run_id }}
        path: 'course-ci-output/candidate.tar

          course-ci-output/release.json

          course-ci-output/dependency-inventory.json

          '
        if-no-files-found: error
        retention-days: 1
    permissions:
      contents: read
      actions: read
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - *id001
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: postman/ci/requirements-test.lock
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: course-candidate-${{ github.run_id }}
        path: course-ci-output
    - name: Install hash-locked Python dependencies and pinned Postman CLI
      run: 'python -m pip install --require-hashes -r postman/ci/requirements-test.lock

        npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/postman-cli" postman-cli@1.93.0

        test "$("$RUNNER_TEMP/postman-cli/node_modules/.bin/postman" --version)" = ''1.93.0''

        echo "POSTMAN_CLI=$RUNNER_TEMP/postman-cli/node_modules/.bin/postman" >> "$GITHUB_ENV"

        '
    - name: Prepare, execute and retain real candidate test evidence
      env:
        DATABASE_URL: ${{ secrets.COURSE_CI_NEON_DATABASE_URL }}
        EXPECTED_HEALTH_STATUS: ${{ inputs.expected_health_status }}
      run: python postman/ci/pipeline.py test
    - name: Retain reports even when tests fail
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: course-tests-${{ github.run_id }}
        path: course-ci-output/test/
        if-no-files-found: error
        retention-days: 1
    - name: Gate / mandatory thresholds and source binding
      run: python postman/ci/pipeline.py gate
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: course-gate-${{ github.run_id }}
        path: course-ci-output/gate.json
        if-no-files-found: error
        retention-days: 1
    - name: Staging and production / dry-run design only
      run: 'echo ''DRY RUN ONLY: same candidate digest; separate targets, identities, costs, migration
        recovery and approval required. No target access or deployment occurs.'''
    - name: Show actual stage lanes in this GitHub run summary
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python postman/ci/pipeline.py stage-summary
    permissions:
      contents: read
      actions: read
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: course-isolated-lab
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: postman/ci/requirements-test.lock
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: course-gate-${{ github.run_id }}
        path: course-ci-output
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: course-candidate-${{ github.run_id }}
        path: course-ci-output
    - name: Install identical hash-locked dependencies and pinned Postman CLI
      run: 'python -m pip install --require-hashes -r postman/ci/requirements-test.lock

        npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/postman-cli" postman-cli@1.93.0

        echo "POSTMAN_CLI=$RUNNER_TEMP/postman-cli/node_modules/.bin/postman" >> "$GITHUB_ENV"

        '
    - name: Deploy the approved bytes, verify them, then stop the temporary API
      env:
        GH_TOKEN: ${{ github.token }}
        DATABASE_URL: ${{ secrets.COURSE_CI_NEON_DATABASE_URL }}
        EXPECTED_HEALTH_STATUS: '200'
        LAUNCHER_RUN_ID: ${{ inputs.launcher_run_id }}
      run: python postman/ci/pipeline.py deploy
    - name: Retain the lab release record and smoke evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: course-lab-deployment-${{ github.run_id }}
        path: course-ci-output/deployment/
        if-no-files-found: error
        retention-days: 1
