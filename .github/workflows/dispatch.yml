# Sends due appointment reminders and notifications every 10 minutes by calling the deployed app.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions): APP_URL (https://your-app.vercel.app) and CRON_SECRET (same value as the CRON_SECRET env var in Vercel).
# Without them this job does nothing. GitHub may delay scheduled runs by several minutes under load.
name: dispatch
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/dispatch
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/internal/dispatch"
